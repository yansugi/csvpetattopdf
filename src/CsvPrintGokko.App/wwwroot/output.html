<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>出力設定 - CSVペタっとPDF</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/site.css" />
  <style>
    .output-page { max-width: 560px; margin: 0 auto; padding: 40px 24px 80px; display: flex; flex-direction: column; gap: 18px; }
    .progress-track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s; }
    .folder-row { display: flex; gap: 8px; }
    .folder-row input { flex: 1; }
    .actions-row { display: flex; justify-content: space-between; align-items: center; }
    .actions-row-left { display: flex; gap: 8px; }
  </style>
</head>
<body>
  <div class="output-page">
    <h1>出力設定</h1>
    <div id="error" class="error-banner hidden"></div>
    <div id="summary" class="field-label"></div>

    <div id="modeSection" class="radio-row">
      <label class="radio-opt" id="modeCombinedLabel">
        <span class="opt-title"><input type="radio" name="mode" value="combined" id="modeCombined" /> 1つのPDFに結合</span>
        <span class="opt-desc">全行を1ファイルにまとめて出力</span>
      </label>
      <label class="radio-opt" id="modeIndividualLabel">
        <span class="opt-title"><input type="radio" name="mode" value="individual" id="modeIndividual" /> 行ごとに個別ファイル</span>
        <span class="opt-desc">1行=1PDFとして出力</span>
      </label>
    </div>
    <div id="listInfoHint" class="field-hint hidden">一覧表テンプレートのため、CSV全行を1つの一覧表としてPDFに出力します。</div>

    <div class="prop-row" id="filenamePatternRow">
      <span class="field-label">ファイル名パターン(個別出力時)</span>
      <input type="text" id="filenamePatternInput" class="text-input" placeholder="例: {氏名}_{発行日}.pdf" />
      <div class="field-hint">CSVの列を <code>{列名}</code>、1始まりの行番号を <code>{行番号}</code>、出力を実行した日時を <code>{出力時間}</code> として使えます(拡張子.pdfは自動補完、ファイル名に使えない文字は_に置換されます)。</div>
      <div id="filenameVariableRow"></div>
    </div>

    <div class="prop-row">
      <span class="field-label">保存先フォルダ</span>
      <div class="folder-row">
        <input type="text" id="outputFolderInput" class="text-input" readonly placeholder="フォルダを選択してください" />
        <button id="browseFolderButton" class="btn btn-file-select">参照...</button>
      </div>
    </div>

    <div class="prop-row hidden" id="progressRow">
      <span class="field-label">進捗</span>
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      <span class="rowbar-text" id="progressText"></span>
    </div>

    <div class="actions-row">
      <div class="actions-row-left">
        <a href="#" id="backToEditorLink" class="btn">← 配置エディタへ戻る</a>
        <a href="#" id="exportProjectLink" class="btn" title="レイアウト・PDF・CSVをまとめて書き出す">📦 エクスポート</a>
      </div>
      <button id="runButton" class="btn btn-primary">出力を実行</button>
    </div>
  </div>

  <script type="module" src="js/heartbeat.js"></script>
  <script type="module" src="js/output.js"></script>
</body>
</html>
