<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>配置エディタ - CSV差込印刷ツール</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <div class="editor-page">
    <div class="toolbar">
      <a href="index.html" class="btn">← ホーム</a>
      <span class="template-name" id="templateNameLabel"></span>
      <button id="loadCsvButton" class="btn">CSV読込</button>
      <button id="saveLayoutButton" class="btn">レイアウト保存</button>
      <button id="undoButton" class="btn" type="button" disabled title="元に戻す (Ctrl+Z)">↶</button>
      <button id="redoButton" class="btn" type="button" disabled title="やり直す (Ctrl+Y)">↷</button>
      <button id="panToolButton" class="btn" type="button" title="手のひらツール">✋ 手のひら</button>
      <button id="togglePreviewButton" class="btn" disabled>プレビュー切替</button>
      <div class="spacer"></div>
      <button id="goToOutputButton" class="btn btn-primary">出力へ</button>
    </div>

    <div class="editor-body">
      <div class="palette" id="palette">
        <div class="field-label">テキストツール</div>
        <div class="tool-chip" id="staticTextChip" draggable="true">
          <span class="grip">⋮⋮</span> 自由テキスト
        </div>
        <div class="tool-chip" id="calcChip" draggable="true">
          <span class="grip">⋮⋮</span> 計算
        </div>
        <div class="field-label palette-section-label">CSV列パレット</div>
        <div id="paletteEmptyHint" class="props-empty">CSVを読み込むと列が表示されます。</div>
      </div>

      <div class="canvas-area" id="canvasArea">
        <div class="zoom-controls">
          <button id="zoomOutButton" class="btn" type="button">－</button>
          <span class="zoom-label" id="zoomLabel">130%</span>
          <button id="zoomInButton" class="btn" type="button">＋</button>
        </div>
        <div class="pdf-stage" id="pdfStage">
          <canvas id="pdfCanvas"></canvas>
        </div>
      </div>

      <div class="props-panel" id="propsPanel">
        <div class="props-empty" id="propsEmptyHint">フィールドを選択すると設定が表示されます。</div>
      </div>
    </div>

    <div class="rowbar">
      <button id="prevRowButton" class="btn" disabled>◀</button>
      <span class="rowbar-text" id="rowbarText">CSV未読込</span>
      <button id="nextRowButton" class="btn" disabled>▶</button>
    </div>
  </div>

  <div id="csvModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <h2>CSV読み込み設定</h2>
      <div class="prop-row">
        <span class="field-label">CSVファイル</span>
        <div class="prop-row-inline">
          <input type="text" id="csvPathDisplay" class="text-input mono-input" readonly placeholder="ファイルが選択されていません" />
          <button id="csvBrowseButton" class="btn btn-file-select" type="button">ファイルを選択</button>
        </div>
      </div>
      <div class="prop-row">
        <span class="field-label">エンコーディング</span>
        <select id="csvEncodingSelect" class="select-input">
          <option value="utf-8">UTF-8</option>
          <option value="shift_jis">Shift-JIS</option>
        </select>
      </div>
      <div class="prop-row">
        <span class="field-label">区切り文字</span>
        <input type="text" id="csvDelimiterInput" class="text-input" value="," maxlength="1" />
      </div>
      <div class="prop-row">
        <label><input type="checkbox" id="csvHasHeaderCheckbox" checked /> 先頭行をヘッダーとして扱う</label>
      </div>
      <div class="modal-actions">
        <button id="csvCancelButton" class="btn">キャンセル</button>
        <button id="csvConfirmButton" class="btn btn-primary">読み込む</button>
      </div>
    </div>
  </div>

  <div id="jsEditorModal" class="modal-backdrop hidden">
    <div class="modal-card js-editor-card">
      <h2>JavaScript式エディタ</h2>
      <div id="jsEditorVariableRow"></div>
      <div id="monacoContainer" class="monaco-container"></div>
      <div class="js-editor-run-row">
        <button type="button" class="btn" id="jsEditorRunButton">▶ 実行してテスト</button>
        <span class="field-hint" id="jsEditorRunHint">CSV読込中は現在プレビュー中の行のデータでテストします。</span>
      </div>
      <pre id="jsEditorConsole" class="js-editor-console"></pre>
      <div class="modal-actions">
        <button id="jsEditorCancelButton" class="btn">キャンセル</button>
        <button id="jsEditorApplyButton" class="btn btn-primary">適用</button>
      </div>
    </div>
  </div>

  <div id="error" class="error-banner hidden" style="position:fixed; bottom:60px; left:50%; transform:translateX(-50%); z-index:100;"></div>

  <script src="lib/monaco-editor/vs/loader.js"></script>
  <script type="module" src="js/editor.js"></script>
</body>
</html>
