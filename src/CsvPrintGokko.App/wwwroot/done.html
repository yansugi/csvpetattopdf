<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>完了 - CSV差込印刷ツール</title>
  <link rel="stylesheet" href="css/site.css" />
  <style>
    .done-page {
      max-width: 460px; margin: 80px auto 0; padding: 40px 32px;
      background: var(--paper-raised); border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
    }
    .done-mark {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--success); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .done-sub { color: var(--ink-muted); font-size: 13px; word-break: break-all; }
    .done-actions { display: flex; gap: 8px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="done-page">
    <div class="done-mark">✓</div>
    <h1 id="doneTitle"></h1>
    <div class="done-sub" id="doneSub"></div>
    <div class="done-actions">
      <button id="openFolderButton" class="btn btn-primary">出力先フォルダを開く</button>
      <a href="index.html" class="btn">ホームに戻る</a>
    </div>
  </div>

  <script type="module" src="js/done.js"></script>
</body>
</html>
